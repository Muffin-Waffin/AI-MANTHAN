# Render Blueprint — AI Manthan backend
# Deploy: Render dashboard → New → Blueprint → point at this repo.
# Fill the sync:false secrets in the dashboard after the first sync.
services:
  - type: web
    name: aimanthan-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # MongoDB Atlas SRV string — set in dashboard
      - key: CORS_ORIGINS
        sync: false # e.g. https://ai-manthan.vercel.app,https://*.vercel.app
      - key: ADMIN_KEY
        generateValue: true # random 32-char hex, rotatable in dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: AI Manthan Support <support@aimanthan.in>
